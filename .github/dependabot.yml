version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      android-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /tools/youtube-tv-capture
    schedule:
      interval: weekly
    groups:
      capture-tooling:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"
