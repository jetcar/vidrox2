name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "ios/**"
      - "app/src/main/res/raw/userscripts.js"
      - "app/src/main/res/mipmap-xxxhdpi-v4/ic_launcher.png"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "${RUNNER_TEMP}/xcodegen.zip"
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Run iOS simulator tests
        run: |
          xcodebuild \
            -project ios/VidroX.xcodeproj \
            -scheme VidroX \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Capture iPhone launch diagnostics
        shell: bash
        run: |
          xcrun simctl boot 'iPhone 16 Pro' 2>/dev/null || true
          xcrun simctl bootstatus 'iPhone 16 Pro' -b
          xcrun simctl install 'iPhone 16 Pro' \
            build/ios-simulator/Build/Products/Debug-iphonesimulator/VidroX.app
          xcrun simctl launch --terminate-running-process \
            'iPhone 16 Pro' com.jetcar.vidrox
          sleep 15
          mkdir -p build/ios-diagnostics
          xcrun simctl io 'iPhone 16 Pro' screenshot \
            build/ios-diagnostics/launch.png
          xcrun simctl spawn 'iPhone 16 Pro' log show \
            --last 2m --style compact \
            --predicate 'process == "VidroX"' \
            > build/ios-diagnostics/launch.log

      - name: Upload iPhone launch diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: VidroX-ios-launch-diagnostics
          path: build/ios-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned iPhone application
        run: |
          xcodebuild \
            -project ios/VidroX.xcodeproj \
            -scheme VidroX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package and verify IPA
        shell: bash
        run: |
          bash ios/scripts/package-ipa.sh \
            build/ios-device/Build/Products/Release-iphoneos/VidroX.app \
            build/VidroX-unsigned.ipa
          unzip -t build/VidroX-unsigned.ipa
          unzip -Z1 build/VidroX-unsigned.ipa | grep -Fx 'Payload/VidroX.app/userscripts.js'
          unzip -Z1 build/VidroX-unsigned.ipa | grep -Fx 'Payload/VidroX.app/ios_bridge.js'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: VidroX-unsigned-ipa
          path: build/VidroX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
