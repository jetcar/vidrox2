name: VidroX

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"

targets:
  VidroX:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VidroX
      - path: ../app/src/main/res/raw/userscripts.js
        buildPhase: resources
        group: VidroX/Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.jetcar.vidrox
        PRODUCT_NAME: VidroX
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VidroX
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
      testTargets:
        - VidroXTests

  VidroXTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VidroXTests
    dependencies:
      - target: VidroX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jetcar.vidrox.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
